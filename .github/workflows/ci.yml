name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Test
        run: python -m pytest -q
      - name: Smoke test CLI
        run: |
          logsentry generate-sample --output demo.log
          logsentry analyze demo.log --format json --output demo.report.json
          python -c "import json; d=json.load(open('demo.report.json')); assert d, 'empty report'"
