[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logsentry"
version = "0.1.0"
description = "SSH/auth log analyzer and brute-force attack detector (defensive security CLI)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "rich>=13.0.0",
]

[project.scripts]
logsentry = "logsentry.cli:main"

[tool.setuptools.packages.find]
# `examples*` is included alongside `logsentry*` so that the installed
# `logsentry` console script (cli.py's `generate-sample` subcommand) can
# `import examples.generate_sample_log` regardless of the caller's working
# directory -- see logsentry/cli.py's module docstring for why.
include = ["logsentry*", "examples*"]
